app-id: com.niltonperimneto.neocalc
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: neocalc
modules:
  - name: neocalc
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - . /usr/lib/sdk/rust-stable/enable.sh && export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 && cargo build --release --manifest-path desktop/Cargo.toml
      - install -Dm755 target/release/neocalc-desktop /app/bin/neocalc
      - install -Dm644 desktop/data/com.niltonperimneto.neocalc.desktop /app/share/applications/com.niltonperimneto.neocalc.desktop
      - install -Dm644 desktop/data/com.niltonperimneto.neocalc.metainfo.xml /app/share/metainfo/com.niltonperimneto.neocalc.metainfo.xml
      - install -Dm644 python/neocalc/resources/com.nilton.neocalc.svg /app/share/icons/hicolor/scalable/apps/com.niltonperimneto.neocalc.svg
      - mkdir -p /app/share/neocalc
      - cp -r python /app/share/neocalc/
    sources:
      - type: dir
        path: .
